version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/daltongarrettpayne/grove

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

run:
  timeout: 5m
