version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/daltongarrettpayne/grove

issues:
  exclude-rules:
    # test files: errcheck false positives on t.Log, etc.
    - path: _test\.go
      linters: [errcheck]
  max-issues-per-linter: 50
  max-same-issues: 10

run:
  timeout: 5m
